<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carnet de Cuisine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23C1652F'/%3E%3Cpath d='M50 20c-9 0-16 6-18 14-7 1-12 7-12 14 0 6 4 11 9 13v9h42v-9c5-2 9-7 9-13 0-7-5-13-12-14-2-8-9-14-18-14z' fill='%23FBF3E7'/%3E%3Crect x='38' y='70' width='24' height='6' rx='2' fill='%23FBF3E7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF3E7;
  --ivoire:#FFFBF5;
  --beige:#F0E1CC;
  --beige-dark:#E4CFAE;
  --terracotta:#C1652F;
  --terracotta-dark:#A54F22;
  --terracotta-light:#E9A672;
  --brown:#3A2A20;
  --brown-soft:#6B5747;
  --gold:#C99A4A;
  --white:#fff;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow:0 6px 20px rgba(58,42,32,0.08);
  --shadow-lg:0 12px 34px rgba(58,42,32,0.14);
  --serif:'Fraunces', serif;
  --sans:'Nunito Sans', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--cream);color:var(--brown);font-family:var(--sans);}
body{padding-bottom:78px;overscroll-behavior-y:none;}
img{max-width:100%;display:block;}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;}
input,textarea,select{font-family:var(--sans);}
h1,h2,h3,.serif{font-family:var(--serif);color:var(--brown);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--beige-dark);border-radius:10px;}

.container{max-width:1100px;margin:0 auto;padding:0 16px;}
.hidden{display:none !important;}

/* ---------- Header / Nav ---------- */
header.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--cream);
  border-bottom:1px solid var(--beige);
  padding:12px 16px;
}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.logo{width:38px;height:38px;flex-shrink:0;}
.brand{font-family:var(--serif);font-weight:600;font-size:1.15rem;letter-spacing:0.3px;flex:1;color:var(--brown);}
.desktop-nav{display:none;gap:4px;}
.desktop-nav button{padding:9px 16px;border-radius:999px;font-weight:700;font-size:0.92rem;color:var(--brown-soft);}
.desktop-nav button.active{background:var(--terracotta);color:#fff;}

nav.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--ivoire);border-top:1px solid var(--beige);
  display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
nav.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--brown-soft);font-size:0.68rem;font-weight:700;padding:4px 8px;border-radius:12px;flex:1;}
nav.bottomnav button svg{width:22px;height:22px;stroke:var(--brown-soft);fill:none;stroke-width:1.8;}
nav.bottomnav button.active{color:var(--terracotta);}
nav.bottomnav button.active svg{stroke:var(--terracotta);}

@media(min-width:860px){
  body{padding-bottom:0;}
  nav.bottomnav{display:none;}
  .desktop-nav{display:flex;}
}

/* ---------- Generic UI ---------- */
.section-title{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .see-all{font-family:var(--sans);font-size:0.82rem;font-weight:700;color:var(--terracotta);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:800;font-size:0.95rem;transition:transform .15s, box-shadow .15s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--terracotta);color:#fff;box-shadow:0 6px 16px rgba(193,101,47,0.35);}
.btn-primary:hover{background:var(--terracotta-dark);}
.btn-outline{background:transparent;border:1.5px solid var(--beige-dark);color:var(--brown);}
.btn-outline:hover{border-color:var(--terracotta);color:var(--terracotta);}
.btn-ghost{background:var(--beige);color:var(--brown);}
.btn-sm{padding:8px 14px;font-size:0.82rem;}
.btn-block{width:100%;}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--beige);color:var(--brown-soft);font-size:0.72rem;font-weight:700;}
.pill-terracotta{background:var(--terracotta);color:#fff;}
.card{background:var(--ivoire);border-radius:var(--radius-lg);box-shadow:var(--shadow);}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--ivoire);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex-shrink:0;}
.icon-btn svg{width:19px;height:19px;stroke:var(--brown);fill:none;stroke-width:1.8;}
.icon-btn.heart.active svg{fill:var(--terracotta);stroke:var(--terracotta);}
input[type=text], input[type=number], input[type=search], textarea, select{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--beige-dark);
  background:var(--ivoire);color:var(--brown);font-size:0.95rem;
}
textarea{resize:vertical;min-height:70px;}
label.field-label{font-size:0.78rem;font-weight:800;color:var(--brown-soft);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;display:block;}
.field{margin-bottom:16px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--brown-soft);}
.empty-state svg{width:56px;height:56px;stroke:var(--beige-dark);margin-bottom:14px;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--brown);color:var(--cream);padding:11px 20px;border-radius:999px;font-size:0.85rem;font-weight:700;z-index:200;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s, bottom .25s;pointer-events:none;}
.toast.show{opacity:1;}
@media(min-width:860px){.toast{bottom:26px;}}

/* fade in */
.view{animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- Home ---------- */
.home-hero{text-align:center;padding:26px 0 6px;}
.home-hero h1{font-size:1.7rem;margin:10px 0 4px;}
.home-hero p{color:var(--brown-soft);margin:0 0 18px;font-size:0.95rem;font-style:italic;}
.search-bar{display:flex;align-items:center;gap:10px;background:var(--ivoire);border-radius:999px;padding:12px 18px;box-shadow:var(--shadow);}
.search-bar svg{width:18px;height:18px;stroke:var(--brown-soft);fill:none;stroke-width:2;flex-shrink:0;}
.search-bar input{border:none;background:none;padding:0;flex:1;}
.search-bar input:focus{outline:none;}

.featured{position:relative;border-radius:var(--radius-lg);overflow:hidden;margin-top:22px;box-shadow:var(--shadow-lg);min-height:230px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--terracotta-light),var(--terracotta));}
.featured img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.featured::after{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(30,18,10,0.82), rgba(30,18,10,0.05) 60%);}
.featured-content{position:relative;z-index:2;padding:20px;color:#fff;width:100%;}
.featured-content .pill{background:rgba(255,255,255,0.22);color:#fff;backdrop-filter:blur(3px);}
.featured-content h2{color:#fff;font-size:1.5rem;margin:10px 0 6px;}
.featured-meta{display:flex;gap:14px;align-items:center;font-size:0.85rem;font-weight:700;margin-bottom:14px;opacity:0.95;}

.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px;}
.shortcut{background:var(--ivoire);border-radius:var(--radius-md);padding:14px 6px;text-align:center;box-shadow:var(--shadow);}
.shortcut svg{width:22px;height:22px;stroke:var(--terracotta);fill:none;stroke-width:1.7;margin:0 auto 6px;}
.shortcut span{font-size:0.72rem;font-weight:800;}

.recipe-scroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity;}
.recipe-scroll::-webkit-scrollbar{display:none;}

.recipe-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:600px){.recipe-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.recipe-grid{grid-template-columns:repeat(4,1fr);}}

.recipe-card{background:var(--ivoire);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow);position:relative;flex-shrink:0;transition:transform .15s;}
.recipe-card:active{transform:scale(0.98);}
.recipe-scroll .recipe-card{width:180px;scroll-snap-align:start;}
.recipe-card .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,var(--beige),var(--beige-dark));display:flex;align-items:center;justify-content:center;}
.recipe-card .thumb svg{width:34px;height:34px;stroke:var(--terracotta-light);fill:none;stroke-width:1.5;}
.recipe-card .fav-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.recipe-card .fav-btn svg{width:16px;height:16px;stroke:var(--terracotta);fill:none;stroke-width:2;}
.recipe-card .fav-btn.active svg{fill:var(--terracotta);}
.recipe-card .info{padding:10px 12px 13px;}
.recipe-card .info .name{font-family:var(--serif);font-weight:600;font-size:0.98rem;line-height:1.2;margin-bottom:5px;}
.recipe-card .info .meta{font-size:0.74rem;color:var(--brown-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.recipe-card .info .rating{color:var(--gold);font-weight:800;}

.random-card{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--brown),#4a382a);border-radius:var(--radius-lg);padding:18px 20px;margin-top:18px;color:#fff;box-shadow:var(--shadow-lg);}
.random-card svg{width:30px;height:30px;stroke:var(--gold);fill:none;stroke-width:1.6;flex-shrink:0;}
.random-card div{flex:1;}
.random-card h3{color:#fff;margin:0 0 3px;font-size:1.05rem;}
.random-card p{margin:0;font-size:0.8rem;color:var(--beige);}

/* ---------- Library ---------- */
.filters-row{display:flex;gap:8px;overflow-x:auto;padding:14px 2px;}
.filters-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:9px 16px;border-radius:999px;background:var(--ivoire);font-weight:700;font-size:0.84rem;box-shadow:var(--shadow);color:var(--brown-soft);border:1.5px solid transparent;}
.chip.active{background:var(--terracotta);color:#fff;}
.chip-filter{background:var(--brown);color:var(--cream);display:flex;align-items:center;gap:6px;}
.chip-filter svg{width:14px;height:14px;stroke:var(--cream);fill:none;stroke-width:2;}

/* ---------- Recipe detail ---------- */
.detail-hero{position:relative;height:280px;border-radius:0 0 var(--radius-lg) var(--radius-lg);overflow:hidden;margin:0 -16px;background:linear-gradient(135deg,var(--beige),var(--beige-dark));}
.detail-hero img{width:100%;height:100%;object-fit:cover;}
.detail-hero-photo-label{display:block;width:100%;height:100%;cursor:pointer;}
.detail-hero-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--brown-soft);gap:6px;font-weight:700;font-size:0.85rem;}
.detail-hero-placeholder svg{width:36px;height:36px;stroke:var(--brown-soft);fill:none;stroke-width:1.5;}
.detail-hero .top-actions{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:3;}
.detail-hero .top-actions .icon-btn{background:rgba(255,255,255,0.9);}
.detail-body{padding-top:20px;}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;}
.detail-stats{display:flex;gap:0;background:var(--ivoire);border-radius:var(--radius-md);box-shadow:var(--shadow);margin:16px 0;overflow:hidden;}
.detail-stats .stat{flex:1;text-align:center;padding:14px 6px;border-right:1px solid var(--beige);}
.detail-stats .stat:last-child{border-right:none;}
.detail-stats .stat .val{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--terracotta);}
.detail-stats .stat .lbl{font-size:0.68rem;color:var(--brown-soft);font-weight:700;margin-top:2px;}

.servings-selector{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--beige);border-radius:999px;padding:10px 20px;margin:16px 0;}
.servings-selector button{width:34px;height:34px;border-radius:50%;background:var(--ivoire);font-size:1.2rem;font-weight:800;color:var(--terracotta);box-shadow:var(--shadow);}
.servings-selector .val{font-weight:800;font-size:1.05rem;min-width:90px;text-align:center;}

.ingredient-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--beige);}
.ingredient-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--terracotta);flex-shrink:0;}
.ingredient-row .qty{font-weight:800;color:var(--terracotta);min-width:64px;font-size:0.9rem;}
.ingredient-row .name{flex:1;font-size:0.93rem;}
.ingredient-row.checked .name{text-decoration:line-through;color:var(--brown-soft);}

.step-block{background:var(--ivoire);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);}
.step-block .step-title{font-family:var(--serif);font-weight:600;font-size:1.02rem;margin-bottom:6px;display:flex;gap:10px;align-items:baseline;}
.step-block .step-num{color:var(--terracotta);font-weight:800;font-size:0.85rem;}
.step-block p{margin:0;font-size:0.9rem;line-height:1.55;color:var(--brown-soft);}
.timer-chip{display:inline-flex;align-items:center;gap:5px;background:var(--beige);color:var(--terracotta-dark);padding:4px 11px;border-radius:999px;font-weight:800;font-size:0.78rem;margin:6px 4px 0 0;border:1.4px solid var(--terracotta-light);cursor:pointer;transition:transform .12s, background .12s;}
.timer-chip:hover{background:var(--terracotta-light);color:#fff;}
.timer-chip:active{transform:scale(0.94);}
.timer-chip svg{pointer-events:none;width:13px;height:13px;stroke:var(--terracotta-dark);fill:none;stroke-width:2;}
.timer-chip:hover svg{stroke:#fff;}

.global-timers-bar{
  position:fixed;left:0;right:0;bottom:78px;z-index:60;
  display:flex;gap:8px;padding:0 12px;overflow-x:auto;
  pointer-events:none;
}
.global-timers-bar:empty{display:none;}
.global-timer-chip{
  pointer-events:auto;flex-shrink:0;background:var(--brown);color:var(--cream);
  border-radius:999px;padding:9px 14px;font-weight:800;font-size:0.8rem;
  display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);
  border:1.5px solid var(--terracotta);
}
.global-timer-chip.done{background:var(--terracotta);animation:pulse 1s infinite;}
.global-timer-chip svg{width:14px;height:14px;stroke:var(--cream);fill:none;stroke-width:2;flex-shrink:0;}
.global-timer-chip button{color:var(--beige);font-size:1.05rem;line-height:1;flex-shrink:0;}
@media(min-width:860px){.global-timers-bar{bottom:20px;justify-content:center;}}


.nutrition-table{width:100%;border-collapse:collapse;font-size:0.87rem;}
.nutrition-table td{padding:9px 4px;border-bottom:1px solid var(--beige);}
.nutrition-table td:last-child{text-align:right;font-weight:800;color:var(--terracotta-dark);}
.nutrition-table tr.sub td:first-child{padding-left:18px;color:var(--brown-soft);font-weight:400;}

.history-item{background:var(--ivoire);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
.history-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.history-item .date{font-size:0.78rem;color:var(--brown-soft);font-weight:700;}
.history-item .stars{color:var(--gold);font-weight:800;font-size:0.9rem;}
.history-item p{margin:0;font-size:0.88rem;color:var(--brown-soft);font-style:italic;}
.history-item img{margin-top:8px;border-radius:10px;max-height:140px;object-fit:cover;}

/* ---------- Cooking mode ---------- */
.cooking-overlay{position:fixed;inset:0;background:var(--brown);color:var(--cream);z-index:500;display:flex;flex-direction:column;}
.cooking-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;}
.cooking-topbar button.close-cook{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;}
.cooking-topbar button.close-cook svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:2;}
.cooking-progress-wrap{padding:0 18px;}
.cooking-progress-label{font-size:0.78rem;font-weight:800;color:var(--terracotta-light);margin-bottom:6px;letter-spacing:0.5px;}
.cooking-progress-bar{height:6px;background:rgba(255,255,255,0.14);border-radius:999px;overflow:hidden;}
.cooking-progress-bar .fill{height:100%;background:var(--terracotta);border-radius:999px;transition:width .3s;}
.cooking-content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 24px 10px;text-align:center;overflow-y:auto;}
.cooking-content h2{color:#fff;font-size:1.7rem;margin:0 0 16px;}
.cooking-content p{font-size:1.08rem;line-height:1.7;color:var(--beige);margin:0 0 20px;}
.cooking-timer-suggest{background:var(--terracotta);color:#fff;padding:16px;border-radius:var(--radius-md);font-size:1.4rem;font-weight:800;margin:10px auto;display:inline-flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.cooking-timer-suggest svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;}
.active-timers-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 18px;}
.active-timer-chip{flex-shrink:0;background:rgba(255,255,255,0.1);border:1.5px solid var(--terracotta);border-radius:999px;padding:8px 16px;font-weight:800;font-size:0.9rem;display:flex;align-items:center;gap:8px;color:#fff;}
.active-timer-chip.done{background:var(--terracotta);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}
.active-timer-chip button{color:var(--beige);font-size:1.1rem;line-height:1;}
.cooking-nav{display:flex;gap:12px;padding:16px 18px calc(20px + env(safe-area-inset-bottom));}
.cooking-nav button{flex:1;padding:18px;border-radius:var(--radius-md);font-weight:800;font-size:1rem;}
.cooking-nav .prev{background:rgba(255,255,255,0.1);color:#fff;}
.cooking-nav .next{background:var(--terracotta);color:#fff;}
.cooking-nav .next:disabled{opacity:0.5;}
.ing-panel-btn{position:absolute;top:16px;right:18px;background:rgba(255,255,255,0.12);color:#fff;padding:9px 15px;border-radius:999px;font-size:0.78rem;font-weight:800;}
.ing-panel{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:600;display:flex;align-items:flex-end;}
.ing-panel-inner{background:var(--cream);width:100%;max-height:75vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px;}
.ing-panel-inner h3{margin-top:0;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(30,20,12,0.55);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--ivoire);border-radius:var(--radius-lg);max-width:440px;width:100%;padding:26px;box-shadow:var(--shadow-lg);max-height:85vh;overflow-y:auto;}
.modal h3{margin-top:0;}
.star-picker{display:flex;gap:6px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.star-picker button{width:32px;height:32px;border-radius:8px;background:var(--beige);font-weight:800;color:var(--brown-soft);font-size:0.85rem;}
.star-picker button.sel{background:var(--terracotta);color:#fff;}

/* ---------- Shopping list ---------- */
.shop-section-title{font-size:0.8rem;font-weight:800;color:var(--brown-soft);text-transform:uppercase;letter-spacing:0.5px;margin:20px 0 8px;}
.shop-item{display:flex;align-items:center;gap:12px;background:var(--ivoire);padding:13px 16px;border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow);}
.shop-item input[type=checkbox]{width:21px;height:21px;accent-color:var(--terracotta);flex-shrink:0;}
.shop-item .txt{flex:1;font-size:0.93rem;}
.shop-item.checked .txt{text-decoration:line-through;color:var(--brown-soft);}
.shop-item .del{color:var(--brown-soft);font-size:1.1rem;padding:4px 6px;}
.add-manual{display:flex;gap:8px;margin-top:14px;}

/* ---------- Menu planning ---------- */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin:16px 0;}
.week-nav button{width:36px;height:36px;border-radius:50%;background:var(--ivoire);box-shadow:var(--shadow);font-weight:800;color:var(--terracotta);}
.day-card{background:var(--ivoire);border-radius:var(--radius-md);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.day-header{padding:12px 16px;font-family:var(--serif);font-weight:600;background:var(--beige);}
.meal-slot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--beige);}
.meal-slot .label{font-size:0.7rem;font-weight:800;color:var(--brown-soft);width:44px;text-transform:uppercase;}
.meal-slot .content{flex:1;font-size:0.88rem;font-weight:700;}
.meal-slot .content.empty{color:var(--brown-soft);font-weight:400;font-style:italic;}
.meal-slot button{color:var(--terracotta);font-size:1.1rem;padding:4px 8px;}

/* ---------- Form ---------- */
.ing-form-row{display:grid;grid-template-columns:70px 90px 1fr 34px;gap:8px;margin-bottom:8px;align-items:center;}
.ing-form-row input,.ing-form-row select{padding:10px;font-size:0.85rem;}
.step-form-block{background:var(--ivoire);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.step-form-block .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.step-form-block .head span{font-weight:800;color:var(--terracotta);font-size:0.85rem;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.photo-upload{border:2px dashed var(--beige-dark);border-radius:var(--radius-md);padding:20px;text-align:center;color:var(--brown-soft);font-size:0.85rem;font-weight:700;cursor:pointer;background:var(--ivoire);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
.photo-upload svg{width:32px;height:32px;stroke:var(--brown-soft);fill:none;stroke-width:1.5;}
.photo-upload img{border-radius:var(--radius-md);max-height:180px;margin:0 auto;object-fit:cover;max-width:100%;}
.visually-hidden-file{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1.5px solid var(--beige-dark);border-radius:var(--radius-sm);background:var(--ivoire);}
.tag-input-wrap .tag{background:var(--beige);padding:4px 10px;border-radius:999px;font-size:0.78rem;font-weight:700;display:flex;align-items:center;gap:6px;}
.tag-input-wrap input{border:none;flex:1;min-width:100px;padding:4px;}
.tag-input-wrap input:focus{outline:none;}

.top-header-bar{display:flex;align-items:center;gap:12px;padding:14px 0;}
.top-header-bar h2{margin:0;flex:1;}
.top-header-bar .icon-btn svg{width:18px;height:18px;}

.backup-box{background:var(--ivoire);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow);margin-top:18px;}
.backup-box .ts{font-size:0.8rem;color:var(--brown-soft);margin-bottom:14px;}
.menu-list{list-style:none;padding:0;margin:0;}
.menu-list li{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--ivoire);border-radius:var(--radius-sm);box-shadow:var(--shadow);margin-bottom:10px;}
.menu-list li svg{width:19px;height:19px;stroke:var(--terracotta);fill:none;stroke-width:1.7;flex-shrink:0;}
.menu-list li .t{flex:1;font-weight:700;font-size:0.92rem;}
.menu-list li .n{color:var(--brown-soft);font-size:0.82rem;}
</style>

/* Compresse une photo côté navigateur avant stockage (évite de saturer le stockage local) */
function compressImageFile(file, maxDim=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(Math.max(w,h) > maxDim){
          const ratio = maxDim / Math.max(w,h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(e){ resolve(reader.result); } // fallback : image d'origine si le canvas échoue
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
}
function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
}
function save(key, val){
  try{
    localStorage.setItem(key, JSON.stringify(val));
    if(key === DB_KEY || key === SHOP_KEY || key === MENU_KEY){
      const meta = load(META_KEY, {});
      meta.lastBackup = nowISO();
      localStorage.setItem(META_KEY, JSON.stringify(meta));
    }
  }catch(e){
    console.error('Écriture impossible dans le stockage local (quota dépassé ?)', e);
    if(typeof toast === 'function'){
      try{ toast('Stockage plein — pense à exporter une sauvegarde et à libérer de la place.'); }catch(t){}
    }
  }
}

ts","content":"Égoutter les haricots Les placer dans un grand faitout avec les carottes, les oignons, l’ail, 3 feuilles de laurier et 1 branche de thym Couvrir d’eau froide à hauteur, environ 2 fois le volume des haricots Porter à ébullition Laisser cuire doucement pendant 1 h à 1 h 30, jusqu’à ce que les haricots soient tendres"},{"title":"Préparation des viandes","content":"Couper 500 g de poitrine de porc en morceaux Faire revenir la poitrine de porc dans une poêle jusqu’à belle coloration Ajouter 400 g de saucisses de Toulouse Faire dorer les saucisses sur toutes leurs faces"},{"title":"Assemblage","content":"Préchauffer le four à 200°C Déposer une couche de haricots dans un grand plat à cassoulet Ajouter la poitrine de porc, les saucisses de Toulouse et 500 g de cuisses de canard confites Recouvrir avec le reste des haricots Arroser avec une partie du jus de cuisson des haricots"},{"title":"Cuisson au four","content":"Enfourner à 200°C pendant 1 h 30 à 2 h Surveiller régulièrement la cuisson Ajouter du jus de cuisson si nécessaire afin que les haricots restent légèrement couverts"},{"title":"Finition","content":"Laisser reposer 10 à 15 min avant de servir"}],"nutrition":{"kcal100":190,"kj100":795,"fat100":10,"satfat100":3.5,"carbs100":13,"sugar100":1.5,"fiber100":4.5,"protein100":11,"salt100":1.2,"finalWeight":3526},"personalRating":null,"personalComment":"Meilleur le lendemain. Attention à la cuisson ne pas hésiter à rajouter du jus de cuisson.","privateNotes":"","isFavorite":false,"guestReviews":[],"versions":[],"realizations":[]},{"title":"Cordons-bleus","mainImage":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pLSwzOko+MzZGNywtQFdBRkxOUlNSMj5aYVpQYEpRUk//2wBDAQ4ODhMREyYVFSZPNS01T09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT0//wAARCAFsAckDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYBAAf/xAA/EAACAQMCBQIEBQMDAwMEAwEBAgMABBESIQUTMUFRImEUMnGBBiNCUpEVobHB0eEzYvAkU/EWQ3KSVFWygv/EABkBAAMBAQE ger poulet, vermicelles, champignons, carottes, ail et oignons. Ajouter 15 ml de sauce huître, 15 ml de sauce nuoc-mam, 5 ml de sauce soja, 5 ml d’huile de sésame, 5 g de sucre, sel et poivre. Bien homogénéiser la farce."},{"title":"Préparation des feuilles de riz","content":"Mélanger lait de coco et eau (1 dose lait de coco + 2 doses d’eau). Badigeonner les feuilles de riz avec ce mélange."},{"title":"Montage des nems","content":"Déposer deux c.à.s de farce au centre. Replier les côtés et rouler serré pour former le nem. Répéter l’opération pour les feuilles de riz."},{"title":"Cuisson","content":"Chauffer 50 ml d’huile dans une poêle ou une friteuse. Frire les nems 5-10 minutes jusqu’à ce qu’ils soient dorés. Égoutter sur papier absorbant."},{"title":"Finition","content":"Servir chaud avec sauce nuoc-mâm ou sauce soja sucrée."}],"nutrition":{"kcal100":220,"kj100":920,"fat100":10,"satfat100":2,"carbs100":20,"sugar100":2,"fiber100":2,"protein100":12,"salt100":0.8,"finalWeight":432},"personalRating":null,"personalComment":"Mettre plus d’épice et de condiments dans la farce je trouve que ça manque de goût.","privateNotes":"","isFavorite":false,"guestReviews":[],"versions":[],"realizations":[]},{"title":"Porc effiloché au cidre, purée rôtie et légumes glacés","mainImage":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgsKCA0LCgsODg0PEyAVExISEyccHhcgLikxMC4pLSwzOko+MzZGNywtQFdBRkxOUlNSMj5aYVpQYEpRUk//2wBDAQ4ODhMREyYVFSZPNS01T09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT09PT0//wAARCAGqAoADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYBAAf/xABBEAACAQMDAwMCAwcDBAECBgMBAgMABBESITEFQVETImFxgRQykQYjQqGxwdFS4fAVM2LxQyRyBxY0U4KSRHOi/8QAGQEAAwEBAQAAAAAAAAAAAAAAAQIDAAQF/8QAKxEAAgICAgIDAAICAgIDAAAAAAECEQMhEjEiQQQTUTJhQnEUI1KBYrHB/9oADAMBAAIRAxEAPwDRgb1IAAVEuBVbzaRSFAjUFFVvNgUM8/t3oZ7hmO3asYKaTfmhpWJqKsTnNdOTxQCQC5qxUNTRPJq5I81jFAizvipKhzvRaxk8CrltTydhWMA+mTgAVakDDnaigkaHnJqm4mKH28UTHNKjepCVBQUlx43qImyd9qBg1rhRwKklwH4pbqyxANX2uA2CaxhgGGN64cnioOQMEV0SDGa function buildImportedRecipes(){
  return IMPORTED_RECIPES_RAW.map(r => ({
    id: uid(),
    ...r,
    ingredients: r.ingredients.map(i => ({id: uid(), ...i})),
    steps: r.steps.map(s => ({id: uid(), ...s})),
    createdAt: nowISO(), updatedAt: nowISO(),
  }));
}

const IMPORT_FLAG_KEY = 'mcc_import_20260918';
try{
  if(!localStorage.getItem(IMPORT_FLAG_KEY)){
    RECIPES = RECIPES.filter(r => r.title !== 'Poulet Tikka Masala' && r.title !== 'Tarte aux légumes');
    const existingTitles = new Set(RECIPES.map(r=>r.title.toLowerCase()));
    buildImportedRecipes().forEach(r=>{
      if(!existingTitles.has(r.title.toLowerCase())) RECIPES.push(r);
    });
    try{ persistRecipes(); }catch(storageErr){ console.error('Sauvegarde impossible (quota dépassé ?)', storageErr); }
    try{ localStorage.setItem(IMPORT_FLAG_KEY, '1'); }catch(e){}
  }
}catch(importErr){
  console.error('Import des recettes : erreur non bloquante', importErr);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- Helpers ---------------- */
function getRecipe(id){ return RECIPES.find(r=>r.id===id); }
function fmtQty(q){
  if(q === null || q === undefined || q === '') return '';
  const r = Math.round(q*100)/100;
  return (r % 1 === 0) ? String(r) : String(Math.round(r*10)/10).replace('.', ',');
}
function scaleQty(qty, refServ, targetServ){
  if(qty === null || qty === undefined) return null;
  const raw = qty * (targetServ/refServ);
  // arrondi intelligent
  if(raw < 1) return Math.round(raw*4)/4; // quarts
  if(raw < 10) return Math.round(raw*2)/2; // demis
  return Math.round(raw);
}
/* Conversion d'unité pour l'affichage — bases exactes :
   1000 g = 1 kg ; 10 ml = 1 cl ; 1000 ml = 1 l ; 100 cl = 1 l */
function smartUnit(qty, unit){
  if(qty === null || qty === undefined || qty === '' || !unit) return {qty, unit};
  if(unit === 'g' && qty >= 1000) return {qty: qty/1000, unit:'kg'};
  if(unit === 'kg' && qty < 1) return {qty: qty*1000, unit:'g'};
  if(unit === 'ml' && qty >= 1000) return {qty: qty/1000, unit:'l'};
  if(unit === 'cl'){
    if(qty >= 100) return {qty: qty/100, unit:'l'};
    if(qty < 1) return {qty: qty*10, unit:'ml'};
  }
  if(unit === 'l' && qty < 1) return {qty: qty*100, unit:'cl'};
  return {qty, unit};
}
function qtyUnitLabel(qty, unit){
  const r = smartUnit(qty, unit);
  return (fmtQty(r.qty) + ' ' + (r.unit||'')).trim();
}
const SERVING_UNIT_LABELS = {
  personnes: {singular:'personne', plural:'personnes'},
  pieces: {singular:'pièce', plural:'pièces'},
  cl: {singular:'cl', plural:'cl'},
  ml: {singular:'ml', plural:'ml'},
  l: {singular:'l', plural:'l'},
};
function servingUnitOf(r){ return (r && r.servingUnit) || 'personnes'; }
function servingLabel(serv, unit){
  unit = unit || 'personnes';
  const def = SERVING_UNIT_LABELS[unit] || {singular:unit, plural:unit};
  const word = serv > 1 ? def.plural : def.singular;
  return `${fmtQty(serv)} ${word}`;
}
function servingStep(unit){
  if(unit === 'cl') return 5;
  if(unit === 'ml') return 50;
  if(unit === 'l') return 0.5;
  return 1;
}
function totalTime(r){ return (r.prepTime||0)+(r.cookingTime||0)+(r.restingTime||0); }
function avgRating(r){
  if(!r.realizations || r.realizations.length===0) return null;
  const s = r.realizations.reduce((a,x)=>a+x.rating,0);
  return (s/r.realizations.length);
}
function placeholderThumb(){
  return `<div class="thumb">${ICONS.photo}</div>`;
}
function recipeCardHTML(r, small){
  const img = r.mainImage ? `<img class="thumb" src="${r.mainImage}" alt="">` : placeholderThumb();
  return `
  <div class="recipe-card" data-open="${r.id}">
    <div style="position:relative">
      ${img}
      <button class="fav-btn ${r.isFavorite?'active':''}" data-fav="${r.id}">${ICONS.heart}</button>
    </div>
    <div class="info">
      <div class="name">${escapeHtml(r.title)}</div>
      <div class="meta">
        <span class="rating">★ ${combinedRating(r) !== null ? combinedRating(r).toFixed(1) : '—'}</span>
        <span>· ${r.category}</span>
      </div>
    </div>
  </div>`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function bindCardEvents(root){
  root.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-fav]')) return;
      go('detail', {id: el.dataset.open});
    });
  });
  root.querySelectorAll('[data-fav]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const r = getRecipe(el.dataset.fav);
      r.isFavorite = !r.isFavorite;
      persistRecipes();
      render();
    });
  });
}

    let suffix, toMinutes;
    if(unit.startsWith('h')){ suffix='H'; toMinutes = v=>v*60; }
    else if(unit.startsWith('min')){ suffix='MIN'; toMinutes = v=>v; }
    else { suffix='SEC'; toMinutes = v=>v/60; }
    const chip = (n)=>`<span class="timer-chip" data-timer="${toMinutes(parseInt(n))}">${ICONS.clock}${n} ${suffix}</span>`;
    return n2 ? chip(n1)+' '+chip(n2) : chip(n1);

let editDraft = null;
/* ---------------- IMPORT RECETTE "COLLER TOUT" ---------------- */
/* Analyse un texte de recette collé en une fois et le découpe automatiquement
   en champs structurés (ingrédients, étapes, nutrition, etc.). Reconnaît les
   intitulés de sections usuels, avec ou sans accents/deux-points/majuscules. */
function parseFrenchRecipeText(content){
  const KNOWN_UNITS = ['c. à café','c. à soupe','pincée','tranche','sachet','kg','g','ml','cl','l'];
  const CATEGORY_MAP = {
    'plat principal':'Plat','plat':'Plat','entree':'Entrée','salade':'Entrée',
    'dessert':'Dessert','sauce':'Sauce','sauces':'Sauce','accompagnement':'Accompagnement',
    'aperitif':'Apéritif','petit-dejeuner':'Petit-déjeuner','petit dejeuner':'Petit-déjeuner','boisson':'Boisson',
    'boulangerie':'Boulangerie','patisserie':'Pâtisserie','snack':'Apéritif',
  };
  const HEADER_MAP = {
    'ingredients':'ingredients','ingredient':'ingredients','ingredients necessaires':'ingredients',
    'instructions':'instructions','preparation et cuisson':'instructions',
    'etapes':'instructions','etape':'instructions','methode':'instructions','realisation':'instructions',
    'notes':'notes','note':'notes','remarques':'notes','remarque':'notes','astuces':'notes','astuce':'notes',
    'nutrition':'nutrition','valeurs nutritionnelles':'nutrition','fiche nutritionnelle':'nutrition','nutrition inco':'nutrition',
    'calories':'calories','kilocalories':'calories','kcal':'calories',
    'portions':'portions','personnes':'portions','pour combien de personnes':'portions','nombre de personnes':'portions',
    'temps':'temps','duree':'temps','duree totale':'temps','temps total':'temps',
    'categories':'categories','categorie':'categories','type':'categories','type de plat':'categories',
  };
  function normNum(s){
    if(s==null) return null;
    s = String(s).replace(/[\u202f\u00a0]/g,'');
    const m = s.match(/\d[\d\s]*[.,]?\d*/);
    if(!m) return null;
    const numStr = m[0].replace(/\s/g,'').replace(',', '.');
    const v = parseFloat(numStr);
    if(isNaN(v)) return null;
    return (v === Math.trunc(v)) ? Math.trunc(v) : v;
  }
  function startsWithQty(line){
    line = line.trim();
    if(!line) return false;
    return /[0-9½¼¾⅓⅔]/.test(line[0]);
  }
  function cleanQtyToken(tok){ return tok.replace('½','.5').replace('¼','.25').replace('¾','.75'); }
  function parseIngredientLine(line){
    line = line.trim().replace(/^[-•*]\s*/,'');
    // Plage explicite "6-8 tortillas" ou "6 à 8 œufs" → on prend la moyenne
    const rangeM = line.match(/^(\d+)\s*(?:-|à)\s*(\d+)\s+(.*)$/i);
    if(rangeM){
      const avg = Math.round((parseInt(rangeM[1])+parseInt(rangeM[2]))/2);
      line = avg + ' ' + rangeM[3];
    }
    const m = line.match(/^([0-9½¼¾⅓⅔][0-9\s,.\/½¼¾⅓⅔]*)\s+(.*)$/);
    if(!m) return {quantity:null, unit:'', name:line};
    let qtyRaw = cleanQtyToken(m[1].trim());
    let rest = m[2];
    let qty;
    if(qtyRaw.includes('/')){
      const parts = qtyRaw.split('/');
      qty = parseFloat(parts[0])/parseFloat(parts[1]);
      if(isNaN(qty)) qty = normNum(qtyRaw);
    } else { qty = normNum(qtyRaw); }
    const restLow = rest.toLowerCase();
    let matchedUnit = null;
    const unitsSorted = [...KNOWN_UNITS].sort((a,b)=>b.length-a.length);
    for(const u of unitsSorted){
      if(restLow===u.toLowerCase() || restLow.startsWith(u.toLowerCase()+' ')){ matchedUnit = u; break; }
    }
    if(matchedUnit) return {quantity:qty, unit:matchedUnit, name:rest.slice(matchedUnit.length).trim()};
    return {quantity:qty, unit:'', name:rest.trim()};
  }
  function parseIngredientsBlock(block){
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    const result = [];
    for(let i=0;i<lines.length;i++){
      const line = lines[i];
      if(!startsWithQty(line)){
        if(i+1<lines.length && startsWithQty(lines[i+1])) result.push({quantity:null, unit:'', name:'— '+line.replace(/^[-•*]\s*/,'')+' —'});
        else result.push({quantity:null, unit:'', name:line.replace(/^[-•*]\s*/,'')});
      } else result.push(parseIngredientLine(line));
    }
    return result;
  }
  function parseInstructionsBlock(block){
    const lines = block.split('\n').map(l=>l.trimEnd()).filter(l=>l.trim());
    const headersPresent = lines.some(l=>l.trim().replace(/^[-•*]\s*/,'').endsWith(':'));
    const steps = [];
    if(!headersPresent){
      // essaie de détecter des étapes numérotées (1. 2. 3. ...), sinon une seule étape avec tout le texte
      const numbered = lines.filter(l=>/^\s*\d+[.)]\s*/.test(l));
      if(numbered.length >= 2){
        lines.forEach(l=>{
          const nm = l.match(/^\s*(\d+)[.)]\s*(.*)$/);
          if(nm) steps.push({title:'Étape '+nm[1], content:nm[2].trim()});
          else if(steps.length) steps[steps.length-1].content += ' ' + l.trim();
        });
        return steps;
      }
      return [{title:'Préparation', content: lines.map(l=>l.trim().replace(/^[-•*]\s*/,'')).join(' ')}];
    }
    let currentTitle=null, currentContent=[];
    for(const l0 of lines){
      const l = l0.trim().replace(/^[-•*]\s*/,'');
      if(l.endsWith(':')){
        if(currentTitle!==null) steps.push({title:currentTitle, content:currentContent.join(' ').trim()});
        currentTitle = l.slice(0,-1).trim();
        currentContent = [];
      } else currentContent.push(l);
    }
    if(currentTitle!==null) steps.push({title:currentTitle, content:currentContent.join(' ').trim()});
    return steps;
  }
  function searchNum(pattern, text){ const m = text.match(pattern); return m ? normNum(m[1]) : null; }
  function parseNutritionBlock(block){
    const n = {};
    let m = block.match(/[ée]nergie\s*:?\s*(?:environ\s*)?([\d\s,.\u202f\u00a0]+)\s*kcal\s*\/\s*(?:environ\s*)?([\d\s,.\u202f\u00a0]+)\s*kj/i);
    if(m){ n.kcal100 = normNum(m[1]); n.kj100 = normNum(m[2]); }
    n.fat100 = searchNum(/(?:lipides|mati[èe]res\s*grasses)\s*:?\s*(?:environ\s*)?([\d\s,.\u202f]+)\s*g/i, block);
    let satfat = searchNum(/satur[ée]e?s?\s*:?\s*(?:environ\s*)?([\d\s,.\u202f]+)\s*g/i, block);
    if(satfat===null) satfat = searchNum(/([\d\s,.\u202f]+)\s*g[^\d]{0,24}?satur[ée]e?s?/i, block);
    n.satfat100 = satfat;
    n.carbs100 = searchNum(/glucides\s*:?\s*(?:environ\s*)?([\d\s,.\u202f]+)\s*g/i, block);
    let sugar = searchNum(/sucres?\s*:?\s*(?:environ\s*)?([\d\s,.\u202f]+)\s*g/i, block);
    if(sugar===null) sugar = searchNum(/([\d\s,.\u202f]+)\s*g[^\d]{0,24}?sucres?/i, block);
    n.sugar100 = sugar;
    n.fiber100 = searchNum(/fibres(?:\s*alimentaires)?\s*:?\s*(?:environ\s*)?([\d\s,.\u202f]+)\s*g/i, block);
    n.protein100 = searchNum(/prot[ée]ines\s*:?\s*(?:environ\s*)?([\d\s,.\u202f]+)\s*g/i, block);
    n.salt100 = searchNum(/\bsel\s*:?\s*(?:environ\s*)?([\d\s,.\u202f]+)\s*g/i, block);
    return n;
  }
  function parseTimeToMinutes(text){
    text = text.trim();
    let m = text.match(/^(\d+)\s*heures?\s*(\d+)?/i);
    if(m) return parseInt(m[1])*60 + (m[2]?parseInt(m[2]):0);
    m = text.match(/(\d+)\s*min/i);
    if(m) return parseInt(m[1]);
    m = text.match(/^(\d+)\s*h\s*(\d+)?/i);
    if(m) return parseInt(m[1])*60 + (m[2]?parseInt(m[2]):0);
    m = text.match(/(\d+)/);
    if(m) return parseInt(m[1]);
    return 0;
  }
  function parseTempsSection(block){
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    let prep=0, cook=0, rest=0, total=0, foundLabel=false;
    lines.forEach(l=>{
      const m = l.match(/^([a-zàâäéèêëïîôöùûüç' ]+)\s*:\s*(.+)$/i);
      if(m){
        const label = stripAccents(m[1].toLowerCase()).trim();
        const val = parseTimeToMinutes(m[2]);
        if(label.startsWith('prep')){ prep = val; foundLabel=true; }
        else if(label.startsWith('cuisson')){ cook = val; foundLabel=true; }
        else if(label.startsWith('repos')){ rest = val; foundLabel=true; }
        else if(label.startsWith('total')){ total = val; foundLabel=true; }
      } else if(!foundLabel){
        const val = parseTimeToMinutes(l);
        if(val) total = total || val;
      }
    });
    if(!prep && !cook && !rest && total) cook = total;
    return {prep, cook, rest};
  }
  function parseCategory(text){
    const parts = text.split(',').map(p=>p.trim()).filter(Boolean);
    const first = stripAccents((parts[0]||'').toLowerCase());
    const tags = parts.slice(1);
    return {category: CATEGORY_MAP[first] || 'Plat', tags};
  }

  // Découpage en sections, tolérant sur les intitulés (correspondance par préfixe :
  // "Fiche nutritionnelle INCO — pour 100 g" est reconnu via la clé "fiche nutritionnelle", etc.)
  // Une ligne du type "Libellé: valeur" (ex. "Préparation: 15 min") n'est PAS un titre de
  // section, même si elle commence par un mot-clé — seule la correspondance exacte compte alors.
  function matchHeader(norm, rawTrimmed){
    if(HEADER_MAP[norm]) return HEADER_MAP[norm];
    if(/:\s*\S/.test(rawTrimmed)) return null;
    const keys = Object.keys(HEADER_MAP).sort((a,b)=>b.length-a.length);
    for(const k of keys){ if(norm.startsWith(k)) return HEADER_MAP[k]; }
    return null;
  }
  const lines = content.split('\n');
  // Si le titre et l'intitulé de la section suivante sont collés sur la même ligne
  // (ex. "Mon Plat Ingrédients"), on les sépare avant analyse.
  {
    const firstIdx = lines.findIndex(l=>l.trim());
    if(firstIdx !== -1){
      const words = lines[firstIdx].trim().split(/\s+/);
      for(let cut=1; cut<words.length; cut++){
        const tail = words.slice(cut).join(' ');
        const tailNorm = stripAccents(tail.toLowerCase()).replace(/[:•]+$/,'').trim();
        if(HEADER_MAP[tailNorm]){
          const head = words.slice(0,cut).join(' ');
          lines.splice(firstIdx, 1, head, tail);
          break;
        }
      }
    }
  }
  let title = '';
  const sections = {};
  let current = null, buffer = [];
  let titleFound = false;
  function flush(){ if(current) sections[current] = (sections[current]||'') + buffer.join('\n') + '\n'; buffer = []; }
  for(const rawLine of lines){
    const trimmed = rawLine.trim();
    const norm = stripAccents(trimmed.toLowerCase()).replace(/[:•]+$/,'').trim();
    if(!titleFound){
      if(trimmed){
        if(matchHeader(norm, trimmed)){ /* la première ligne non vide est déjà un intitulé : pas de titre explicite */ }
        else { title = trimmed; titleFound = true; continue; }
      }
      continue;
    }
    const hdr = matchHeader(norm, trimmed);
    if(hdr && trimmed.length < 55){
      flush();
      current = hdr;
      continue;
    }
    if(current) buffer.push(rawLine);
  }
  flush();

  const ingredients = sections.ingredients ? parseIngredientsBlock(sections.ingredients) : [];
  const steps = sections.instructions ? parseInstructionsBlock(sections.instructions) : [];
  const nutrition = sections.nutrition ? parseNutritionBlock(sections.nutrition) : {};

  const caloriesLine = sections.calories ? (sections.calories.split('\n').find(l=>l.trim())||'').trim() : '';
  const totalKcal = caloriesLine ? normNum(caloriesLine) : null;
  if(nutrition.kcal100 && totalKcal) nutrition.finalWeight = Math.round(totalKcal / nutrition.kcal100 * 100);
  else nutrition.finalWeight = nutrition.finalWeight || null;

  const portionsText = sections.portions ? (sections.portions.split('\n').find(l=>l.trim())||'2 personnes').trim() : '2 personnes';
  const pm = portionsText.match(/^([\d,.\u202f]+)/);
  const ptextLow = stripAccents(portionsText.toLowerCase());
  const KNOWN_VOL_UNITS = {'cl':'cl','ml':'ml','l':'l','piece':'pièces','pieces':'pièces','part':'pièces','parts':'pièces'};
  let servings, servingUnit = 'personnes', servingsNote = null;
  if(pm && ptextLow.includes('personne')){
    const raw = normNum(pm[1]);
    servings = raw ? Math.max(1, Math.round(raw)) : 2;
  } else if(pm){
    let matchedUnit = null;
    for(const kw in KNOWN_VOL_UNITS){ if(ptextLow.includes(kw)){ matchedUnit = KNOWN_VOL_UNITS[kw]; break; } }
    const raw = normNum(pm[1]);
    if(matchedUnit && raw){ servings = raw; servingUnit = matchedUnit; }
    else { servings = 1; servingsNote = "Quantité telle qu'indiquée : " + portionsText; }
  } else { servings = 2; }

  const tempsResult = sections.temps ? parseTempsSection(sections.temps) : {prep:0, cook:0, rest:0};

  const catText = sections.categories ? (sections.categories.split('\n').find(l=>l.trim())||'Plat').trim() : 'Plat';
  const {category, tags} = parseCategory(catText);

  const commentParts = [];
  if(sections.notes) commentParts.push(sections.notes.replace(/\n+/g,' ').trim());
  if(servingsNote) commentParts.push(servingsNote);

  return {
    title: title || '', category, tags, difficulty:'Moyen',
    referenceServings: servings, servingUnit,
    prepTime: tempsResult.prep, cookingTime: tempsResult.cook, restingTime: tempsResult.rest,
    ingredients, steps, nutrition,
    personalComment: commentParts.join(' ').trim(),
  };
}

function normalizeIngName(name){
  let n = name.trim().toLowerCase();
  n = n.replace(/^(de |d'|du |des |la |le |les |un |une )/,'');
  if(n.endsWith('s') && n.length>3) n = n.slice(0,-1); // singulier basique
  return n;
}

function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function guessAisle(name){
  const n = stripAccents((name||'').toLowerCase());
  for(const aisle of AISLES){
    for(const kw of aisle.keywords){
      if(n.includes(stripAccents(kw))) return aisle.name;
    }
  }
  return 'Autres';
}
function addRecipeToShopping(recipeId, servings){
  const r = getRecipe(recipeId);
  if(!r) return;
  r.ingredients.forEach(ing=>{
    const q = scaleQty(ing.quantity, r.referenceServings, servings);
    const key = normalizeIngName(ing.name) + '|' + (ing.unit||'');
    const existing = SHOPPING.toBuy.find(it => it.mergeKey === key);
    if(existing && typeof q === 'number' && typeof existing.quantity === 'number'){
      existing.quantity += q;
      existing.sources.push(r.title);
    } else {
      SHOPPING.toBuy.push({
        id: uid(), mergeKey:key, name: ing.name, unit: ing.unit||'',
        quantity: (typeof q==='number')?q:null, checked:false, sources:[r.title],
        aisle: guessAisle(ing.name)
      });
    }
  });
  persistShopping();
  toast('Ajouté à la liste de courses');
}

  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day+offset*7);
  d.setHours(0,0,0,0);

}

/* ---------------- MINUTEURS (globaux, accessibles partout, survivent à une actualisation) ---------------- */
let timers = []; // {id, label, endTime, done, interval}
const COOKING_STATE_KEY = 'mcc_cooking_state_v1';
function persistCookingState(){
  try{
    if(state.cooking) sessionStorage.setItem(COOKING_STATE_KEY, JSON.stringify(state.cooking));
    else sessionStorage.removeItem(COOKING_STATE_KEY);
  }catch(e){}
}
function startCookingMode(recipeId){
  const r = getRecipe(recipeId);
  if(!r) return;
  state.cooking = {recipeId, stepIndex:0, servings: state.servingsOverride[recipeId] || r.referenceServings};
  persistCookingState();
  requestWakeLock();
  renderCookOverlay();
}
function stopCookingMode(){
  if(state.cooking && state.cooking.recipeId){
    try{ sessionStorage.removeItem('mcc_ing_checked_'+state.cooking.recipeId); }catch(e){}
  }
  state.cooking = null;
  persistCookingState();
  releaseWakeLock();
  document.getElementById('cookRoot').innerHTML = '';
  renderActiveTimers();
}
let wakeLock = null;
async function requestWakeLock(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWakeLock(){ try{ wakeLock && wakeLock.release(); wakeLock=null; }catch(e){} }

let audioCtx = null;
function ensureAudioContext(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  try{
    ensureAudioContext();
    if(audioCtx){
      for(let i=0;i<3;i++){
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = 880; o.type='sine';
        const t0 = audioCtx.currentTime + i*0.35;
        g.gain.setValueAtTime(0.001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0+0.3);
        o.start(t0); o.stop(t0+0.32);
      }
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]); }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
}

const TIMERS_KEY = 'mcc_timers_v1';
function persistTimers(){
  try{
    localStorage.setItem(TIMERS_KEY, JSON.stringify(timers.map(t=>({id:t.id, label:t.label, endTime:t.endTime, done:t.done}))));
  }catch(e){}
}
function createTimerObject(id, label, endTime, alreadyDone){
  const timer = {id, label, endTime, done: !!alreadyDone};
  timer.interval = setInterval(()=>{
    const remain = Math.max(0, Math.round((timer.endTime - Date.now())/1000));
    if(remain<=0 && !timer.done){
      timer.done = true;
      clearInterval(timer.interval);
      beep();
      persistTimers();
    }
    renderActiveTimers();
  },1000);
  return timer;
}
function addTimer(minutes, label){
  ensureAudioContext(); // débloque le son pendant qu'on a un vrai geste utilisateur
  const id = uid();
  const endTime = Date.now() + Math.round(minutes*60*1000);
  const timer = createTimerObject(id, label || (minutes+' min'), endTime);
  timers.push(timer);
  persistTimers();
  renderActiveTimers();
  toast('Minuteur lancé : '+timer.label);
}
function restoreTimers(){
  try{
    const raw = localStorage.getItem(TIMERS_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    const now = Date.now();
    let any = false;
    saved.forEach(t=>{
      if(t.done) return; // ne pas ressusciter une alarme déjà terminée/vue
      if(now - t.endTime > 10*60*1000) return; // trop ancien (>10 min de retard), on ignore
      timers.push(createTimerObject(t.id, t.label, t.endTime));
      any = true;
    });
    if(any) renderActiveTimers();
  }catch(e){}
}
function removeTimer(id){
  const t = timers.find(x=>x.id===id);
  if(t) clearInterval(t.interval);
  timers = timers.filter(x=>x.id!==id);
  persistTimers();
  renderActiveTimers();
}
function fmtTimer(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function timerChipHTML(t, cls){
  const remain = Math.max(0, Math.round((t.endTime - Date.now())/1000));
  const isDone = t.done || remain<=0;
  return `<div class="${cls} ${isDone?'done':''}">
      ${ICONS.clock} ${escapeHtml(t.label)} · ${fmtTimer(remain)}
      <button data-rmTimer="${t.id}">×</button>
    </div>`;
}
function renderActiveTimers(){
  const cookEl = document.getElementById('activeTimersBar');
  if(cookEl){
    cookEl.innerHTML = timers.map(t=>timerChipHTML(t,'active-timer-chip')).join('');
    cookEl.querySelectorAll('[data-rmTimer]').forEach(b=>{ b.onclick = ()=> removeTimer(b.dataset.rmtimer); });
  }
  const globalEl = document.getElementById('globalTimersBar');
  if(globalEl){
    globalEl.innerHTML = timers.map(t=>timerChipHTML(t,'global-timer-chip')).join('');
    globalEl.querySelectorAll('[data-rmTimer]').forEach(b=>{ b.onclick = ()=> removeTimer(b.dataset.rmtimer); });
  }
}


function renderCookOverlay(){
  const root = document.getElementById('cookRoot');
  const r = getRecipe(state.cooking.recipeId);
  const idx = state.cooking.stepIndex;
  const step = r.steps[idx];
  const total = r.steps.length;
  const durMatches = [...step.content.matchAll(/(\d+)\s*(heures?|h\b|min(?:ute)?s?|sec(?:onde)?s?)\b/gi)];
  const durations = durMatches.map(m=>{
    const val = parseInt(m[1]);
    const unit = m[2].toLowerCase();
    if(unit.startsWith('h')) return {minutes: val*60, label: val+' H'};
    if(unit.startsWith('min')) return {minutes: val, label: val+' MIN'};
    return {minutes: val/60, label: val+' SEC'};
  });

  root.innerHTML = `
  <div class="cooking-overlay">
    <div class="cooking-topbar">
      <button class="close-cook" id="closeCook">${ICONS.x}</button>
      <div style="font-weight:800;font-size:0.85rem;color:var(--terracotta-light)">${escapeHtml(r.title)}</div>
      <button class="close-cook" id="ingPanelBtn">${ICONS.book}</button>
    </div>
    <div class="cooking-progress-wrap">
      <div class="cooking-progress-label">ÉTAPE ${idx+1} / ${total}</div>
      <div class="cooking-progress-bar"><div class="fill" style="width:${((idx+1)/total)*100}%"></div></div>
    </div>
    <div class="active-timers-bar" id="activeTimersBar"></div>
    <div class="cooking-content">
      <h2>${escapeHtml(step.title)}</h2>
      <p>${escapeHtml(step.content)}</p>
      ${durations.length ? `<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        ${durations.map(d=>`<button class="cooking-timer-suggest" data-launchtimer="${d.minutes}">${ICONS.clock} ${d.label}</button>`).join('')}
      </div>` : ''}
    </div>
    <div class="cooking-nav">
      <button class="prev" id="cookPrev" ${idx===0?'disabled':''}>← Précédent</button>
      <button class="next" id="cookNext">${idx===total-1?'Terminer 🎉':'Suivant →'}</button>
    </div>
  </div>`;
  renderActiveTimers();

  document.getElementById('closeCook').onclick = stopCookingMode;
  document.getElementById('cookPrev').onclick = ()=>{ state.cooking.stepIndex--; persistCookingState(); renderCookOverlay(); };
  document.getElementById('cookNext').onclick = ()=>{
    if(idx===total-1){ finishCooking(); } else { state.cooking.stepIndex++; persistCookingState(); renderCookOverlay(); }
  };
  root.querySelectorAll('[data-launchtimer]').forEach(b=>{
    b.onclick = ()=> addTimer(parseFloat(b.dataset.launchtimer), step.title);
  });
  document.getElementById('ingPanelBtn').onclick = ()=> showIngredientsPanel(r);
}

function showIngredientsPanel(r){
  const serv = state.cooking.servings;
  const checkedKey = 'mcc_ing_checked_'+r.id;
  function getChecked(){
    try{ return JSON.parse(sessionStorage.getItem(checkedKey)||'[]'); }catch(e){ return []; }
  }
  function setChecked(arr){
    try{ sessionStorage.setItem(checkedKey, JSON.stringify(arr)); }catch(e){}
  }
  const overlay = document.createElement('div');
  overlay.className = 'ing-panel';
  function draw(){
    const checked = getChecked();
    const todo = r.ingredients.filter(ing=>!checked.includes(ing.id));
    const done = r.ingredients.filter(ing=>checked.includes(ing.id));
    const row = (ing, isChecked)=>{
      const q = scaleQty(ing.quantity, r.referenceServings, serv);
      return `<div class="ingredient-row ${isChecked?'checked':''}"><input type="checkbox" data-ingid="${ing.id}" ${isChecked?'checked':''}><span class="qty">${qtyUnitLabel(q, ing.unit)}</span><span class="name">${escapeHtml(ing.name)}</span></div>`;
    };
    overlay.innerHTML = `<div class="ing-panel-inner">
      <h3>Ingrédients — ${servingLabel(serv, servingUnitOf(r))}</h3>
      ${todo.map(ing=>row(ing,false)).join('')}
      ${done.length ? `<div class="shop-section-title">Déjà ajouté</div>${done.map(ing=>row(ing,true)).join('')}` : ''}
      <button class="btn btn-primary btn-block" style="margin-top:16px" id="closeIngPanel">Fermer</button>
    </div>`;
    overlay.querySelectorAll('[data-ingid]').forEach(cb=>{
      cb.onchange = ()=>{
        let arr = getChecked();
        if(cb.checked) arr = [...new Set([...arr, cb.dataset.ingid])];
        else arr = arr.filter(id=>id!==cb.dataset.ingid);
        setChecked(arr);
        draw();
      };
    });
    overlay.querySelector('#closeIngPanel').onclick = ()=> overlay.remove();
  }
  draw();
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  document.getElementById('cookRoot').appendChild(overlay);
}

function buildGuestLink(r){
  const meta = load(META_KEY, {});
  const payload = {
    id:r.id, title:r.title, category:r.category, tags:r.tags||[], email: meta.guestEmail||'', phone: meta.guestPhone||'',
    referenceServings:r.referenceServings, servingUnit:r.servingUnit,
    prepTime:r.prepTime, cookingTime:r.cookingTime, restingTime:r.restingTime,
    ingredients:r.ingredients, steps:r.steps, nutrition:r.nutrition,
  };
  const base = location.href.split('#')[0];
  return base + '#guest=' + b64encode(payload);
}
/* Reconstruit un texte de recette au même format que celui attendu par
   "Coller une recette entière", pour que l'invité puisse copier-coller
   et importer la recette directement dans son propre Carnet de Cuisine. */
function recipeToPasteText(r){
  const lines = [];
  lines.push(r.title || 'Recette', '', 'Ingrédients', '');
  (r.ingredients||[]).forEach(i=>{
    lines.push(i.quantity!=null ? `${i.quantity}${i.unit?(' '+i.unit):''} ${i.name}` : i.name);
  });
  lines.push('', 'Préparation et cuisson', '');
  (r.steps||[]).forEach(s=>{ lines.push((s.title||'Étape')+':', s.content||'', ''); });
  lines.push('Temps total', '');
  if(r.prepTime) lines.push('Préparation: '+r.prepTime+' min');
  if(r.cookingTime) lines.push('Cuisson: '+r.cookingTime+' min');
  const total = (r.prepTime||0)+(r.cookingTime||0)+(r.restingTime||0);
  if(total) lines.push('Total: '+total+' min');
  const n = r.nutrition||{};
  if(n.finalWeight && n.kcal100){
    lines.push('', 'Kilocalories totales du plat', '', '≈ '+Math.round(n.kcal100*n.finalWeight/100)+' kcal');
  }
  if(n.kcal100){
    lines.push('', 'Fiche nutritionnelle INCO — pour 100 g', '');
    lines.push(`Énergie: ${n.kcal100} kcal / ${n.kj100||'—'} kJ`);
    if(n.fat100!=null) lines.push(`Lipides: ${n.fat100} g${n.satfat100!=null?` (dont acides gras saturés: ${n.satfat100} g)`:''}`);
    if(n.carbs100!=null) lines.push(`Glucides: ${n.carbs100} g${n.sugar100!=null?` (dont sucres: ${n.sugar100} g)`:''}`);
    if(n.fiber100!=null) lines.push(`Fibres: ${n.fiber100} g`);
    if(n.protein100!=null) lines.push(`Protéines: ${n.protein100} g`);
    if(n.salt100!=null) lines.push(`Sel: ${n.salt100} g`);
  }
  lines.push('', 'Portions', '', servingLabel(r.referenceServings, servingUnitOf(r)));
  if(r.category || (r.tags&&r.tags.length)){
    lines.push('', 'Catégories', '', [r.category, ...(r.tags||[])].filter(Boolean).join(', '));
  }
  return lines.join('\n');
}

      const step = Math.abs(parseFloat(el.dataset.servDelta));
      const cur = state.servingsOverride[id] || r.referenceServings;
      const nv = Math.max(step, cur + parseFloat(el.dataset.servDelta));
      state.servingsOverride[id] = Math.round(nv*100)/100;
      render();
    };
  });
  app.querySelectorAll('[data-serv-set]').forEach(el=>{
    el.onclick = ()=>{ state.servingsOverride[state.params.id] = parseFloat(el.dataset.servSet); render(); };
  });
  const addShop = document.getElementById('addToShopping');
  if(addShop) addShop.onclick = ()=> showServingsModalForShopping(getRecipe(addShop.dataset.recipeid));

  });
  const shareBtn = document.getElementById('shareForReview');
  if(shareBtn) shareBtn.onclick = ()=> showShareForReviewModal(getRecipe(shareBtn.dataset.recipeid));
  const addGuestBtn = document.getElementById('addGuestReview');
  if(addGuestBtn) addGuestBtn.onclick = ()=> showAddGuestReviewModal(getRecipe(addGuestBtn.dataset.recipeid));
  app.querySelectorAll('.timer-chip[data-timer]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const mins = parseFloat(el.dataset.timer);
      const stepBlock = el.closest('.step-block');
      let label = 'Minuteur';
      if(stepBlock){
        const titleEl = stepBlock.querySelector('.step-title');
        if(titleEl) label = titleEl.textContent.replace(/^\d+\.\s*/,'').trim();
      }
      addTimer(mins, label);
    });
  });

  // EDIT
  bindEditEvents(app);

  // SHOPPING
  bindShoppingEvents(app);

  // MENU
  bindMenuEvents(app);

  // PROFILE
  bindProfileEvents(app);
}

let navHistory = [];
const VIEW_STATE_KEY = 'mcc_view_state_v1';
function persistViewState(){
  try{ sessionStorage.setItem(VIEW_STATE_KEY, JSON.stringify({view: state.view, params: state.params})); }catch(e){}
}
const origGo = go;
go = function(view, params={}){
  navHistory.push({view:state.view, params:state.params});
  if(navHistory.length>30) navHistory.shift();
  origGo(view, params);
  persistViewState();
};
function history_back(){
  if(state.view === 'edit') editDraft = null;
  const prev = navHistory.pop();
  if(prev) origGo(prev.view, prev.params); else origGo('home');
  persistViewState();
}

/* ---------------- EDIT bindings ---------------- */
function bindEditEvents(app){
  const bulkParseBtn = document.getElementById('bulkParseBtn');
  if(bulkParseBtn){
    bulkParseBtn.onclick = ()=>{
      const textEl = document.getElementById('bulkPasteArea');
      const text = textEl ? textEl.value : '';
      if(!text || !text.trim()){ toast('Colle d\'abord le texte de ta recette'); return; }
      syncEditFields();
      try{
        const parsed = parseFrenchRecipeText(text);
        if(parsed.title) editDraft.title = parsed.title;
        if(parsed.category) editDraft.category = parsed.category;
        if(parsed.tags && parsed.tags.length) editDraft.tags = parsed.tags;
        if(parsed.referenceServings) editDraft.referenceServings = parsed.referenceServings;
        if(parsed.servingUnit) editDraft.servingUnit = parsed.servingUnit;
        if(parsed.prepTime) editDraft.prepTime = parsed.prepTime;
        if(parsed.cookingTime) editDraft.cookingTime = parsed.cookingTime;
        if(parsed.restingTime) editDraft.restingTime = parsed.restingTime;
        if(parsed.ingredients && parsed.ingredients.length) editDraft.ingredients = parsed.ingredients.map(i=>({id:uid(), ...i}));
        if(parsed.steps && parsed.steps.length) editDraft.steps = parsed.steps.map(s=>({id:uid(), ...s}));
        if(parsed.nutrition){
          Object.keys(parsed.nutrition).forEach(k=>{
            if(parsed.nutrition[k] !== null && parsed.nutrition[k] !== undefined) editDraft.nutrition[k] = parsed.nutrition[k];
          });
        }
        if(parsed.personalComment) editDraft.personalComment = parsed.personalComment;
        render();
        toast('Recette analysée — vérifie les champs avant d\'enregistrer');
      }catch(err){
        console.error(err);
        toast('Analyse impossible, remplis les champs manuellement');
      }
    };
  }
  const mainPhotoLabel = document.getElementById('mainPhotoLabel');
  if(mainPhotoLabel){
    const mainPhotoInput = document.getElementById('mainPhotoInput');
    mainPhotoLabel.onclick = (e)=>{ if(!e.isTrusted) return; e.preventDefault(); mainPhotoInput.click(); };
    mainPhotoInput.onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      compressImageFile(f).then(dataUrl=>{ editDraft.mainImage = dataUrl; render(); })
        .catch(()=> toast('Impossible de lire cette photo'));
    };
  }
  const tagInput = document.getElementById('tagInput');
  if(tagInput){
    tagInput.onkeydown = (e)=>{
      if(e.key==='Enter' && tagInput.value.trim()){
        e.preventDefault();
        editDraft.tags.push(tagInput.value.trim());
        syncEditFields();
        render();
      }
    };
    app.querySelectorAll('[data-rmtag]').forEach(b=>{
      b.onclick = ()=>{ editDraft.tags = editDraft.tags.filter(t=>t!==b.dataset.rmtag); syncEditFields(); render(); };
    });
  }
  const tagSelect = document.getElementById('tagSelect');
  if(tagSelect){
    tagSelect.onchange = ()=>{
      if(tagSelect.value){
        syncEditFields();
        editDraft.tags.push(tagSelect.value);
        render();
      }
    };
  }
  const addIng = document.getElementById('addIngRow');
  if(addIng) addIng.onclick = ()=>{ syncEditFields(); editDraft.ingredients.push({id:uid(),quantity:'',unit:'g',name:''}); render(); };
  app.querySelectorAll('[data-rmIng]').forEach(b=>{
    b.onclick = ()=>{ syncEditFields(); editDraft.ingredients.splice(parseInt(b.dataset.rmIng),1); render(); };
  });
  const addStep = document.getElementById('addStepRow');
  if(addStep) addStep.onclick = ()=>{ syncEditFields(); editDraft.steps.push({id:uid(),title:'',content:''}); render(); };
  app.querySelectorAll('[data-rmStep]').forEach(b=>{
    b.onclick = ()=>{ syncEditFields(); editDraft.steps.splice(parseInt(b.dataset.rmStep),1); render(); };
  });
  const cancelBtn = document.getElementById('cancelEdit');
  if(cancelBtn) cancelBtn.onclick = ()=>{ editDraft = null; history_back(); };
  const saveBtn = document.getElementById('saveRecipe');
  if(saveBtn) saveBtn.onclick = ()=>{
    syncEditFields();
    if(!editDraft.title.trim()){ toast('Merci d\'indiquer un nom de recette'); return; }
    editDraft.ingredients = editDraft.ingredients.filter(i=>i.name.trim());
    editDraft.steps = editDraft.steps.filter(s=>s.title.trim() || s.content.trim());
    editDraft.updatedAt = nowISO();
    delete editDraft._fresh;
    const idx = RECIPES.findIndex(r=>r.id===editDraft.id);
    if(idx>=0) RECIPES[idx] = editDraft; else RECIPES.push(editDraft);
    persistRecipes();
    const savedId = editDraft.id;
    editDraft = null;
    toast('Recette enregistrée');
    go('detail', {id: savedId});
  };
}
function syncEditFields(){
  if(!editDraft) return;
  const g = id => document.getElementById(id);
  if(g('f-title')) editDraft.title = g('f-title').value;
  if(g('f-category')) editDraft.category = g('f-category').value;
  if(g('f-difficulty')) editDraft.difficulty = g('f-difficulty').value;
  if(g('f-servings')) editDraft.referenceServings = parseFloat(g('f-servings').value)||1;
  if(g('f-servunit')) editDraft.servingUnit = g('f-servunit').value;
  if(g('f-prep')) editDraft.prepTime = parseInt(g('f-prep').value)||0;
  if(g('f-cook')) editDraft.cookingTime = parseInt(g('f-cook').value)||0;
  if(g('f-rest')) editDraft.restingTime = parseInt(g('f-rest').value)||0;
  if(g('f-comment')) editDraft.personalComment = g('f-comment').value;
  if(g('f-privnotes')) editDraft.privateNotes = g('f-privnotes').value;
  document.querySelectorAll('[data-ingrow]').forEach(row=>{
    const i = parseInt(row.dataset.ingrow);
    if(!editDraft.ingredients[i]) return;
    editDraft.ingredients[i].quantity = row.querySelector('[data-ing=qty]').value === '' ? '' : parseFloat(row.querySelector('[data-ing=qty]').value);
    editDraft.ingredients[i].unit = row.querySelector('[data-ing=unit]').value;
    editDraft.ingredients[i].name = row.querySelector('[data-ing=name]').value;
  });
  document.querySelectorAll('[data-steprow]').forEach(row=>{
    const i = parseInt(row.dataset.steprow);
    if(!editDraft.steps[i]) return;
    editDraft.steps[i].title = row.querySelector('[data-step=title]').value;
    editDraft.steps[i].content = row.querySelector('[data-step=content]').value;
  });
  ['kcal','kj','weight','fat','satfat','carbs','sugar','fiber','protein','salt'].forEach(k=>{
    const el = document.getElementById('n-'+k);
    if(el){
      const field = k==='weight'?'finalWeight':(k+'100');
      editDraft.nutrition[field] = el.value===''?'':parseFloat(el.value);
    }
  });
}

/* ---------------- SHOPPING bindings ---------------- */
function bindShoppingEvents(app){
  app.querySelectorAll('[data-shopcheck]').forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.shopcheck;
      const idx = SHOPPING.toBuy.findIndex(i=>i.id===id);
      if(idx>=0){ const [it] = SHOPPING.toBuy.splice(idx,1); it.checked=true; SHOPPING.bought.unshift(it); persistShopping(); render(); }
    };
  });
  app.querySelectorAll('[data-shopuncheck]').forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.shopuncheck;
      const idx = SHOPPING.bought.findIndex(i=>i.id===id);
      if(idx>=0){ const [it] = SHOPPING.bought.splice(idx,1); it.checked=false; SHOPPING.toBuy.unshift(it); persistShopping(); render(); }
    };
  });
  app.querySelectorAll('[data-shopdel]').forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.shopdel;
      SHOPPING.toBuy = SHOPPING.toBuy.filter(i=>i.id!==id);
      SHOPPING.bought = SHOPPING.bought.filter(i=>i.id!==id);
      persistShopping(); render();
    };
  });
  const addManual = document.getElementById('addManualShop');
  if(addManual){
    const doAdd = ()=>{
      const input = document.getElementById('manualShopInput');
      if(!input.value.trim()) return;
      SHOPPING.toBuy.push({id:uid(), mergeKey:uid(), name:input.value.trim(), unit:'', quantity:null, checked:false, sources:[], aisle:guessAisle(input.value.trim())});
      persistShopping(); render();
    };
    addManual.onclick = doAdd;
    document.getElementById('manualShopInput').onkeydown = (e)=>{ if(e.key==='Enter') doAdd(); };
  }
  const clearBoughtBtn = document.getElementById('clearBought');
  if(clearBoughtBtn) clearBoughtBtn.onclick = ()=>{
    if(!confirm('Vider tout ce qui est déjà acheté ? Cette action est définitive.')) return;
    SHOPPING.bought = []; persistShopping(); render();
  };
  const clearBtn = document.getElementById('clearShopping');
  if(clearBtn) clearBtn.onclick = ()=>{
    if(!confirm('Vider toute la liste (à acheter + déjà acheté) ? Cette action est définitive.')) return;
    SHOPPING = {toBuy:[], bought:[]}; persistShopping(); render();
  };
}

/* ---------------- MENU bindings ---------------- */
function bindMenuEvents(app){
  const prev = document.getElementById('prevWeek'); if(prev) prev.onclick = ()=>{ weekOffset--; render(); };
  const next = document.getElementById('nextWeek'); if(next) next.onclick = ()=>{ weekOffset++; render(); };
  app.querySelectorAll('[data-menuadd]').forEach(b=>{ b.onclick = ()=> showMenuPickModal(b.dataset.menuadd); });
  app.querySelectorAll('[data-menuslot]').forEach(b=>{ b.onclick = ()=>{ if(!MENU[b.dataset.menuslot]) showMenuPickModal(b.dataset.menuslot); }; });
  app.querySelectorAll('[data-menuclear]').forEach(b=>{
    b.onclick = ()=>{ delete MENU[b.dataset.menuclear]; persistMenu(); render(); };
  });
  const genBtn = document.getElementById('genShoppingFromMenu');
  if(genBtn) genBtn.onclick = ()=>{
    let count = 0;
    Object.values(MENU).forEach(entry=>{ addRecipeToShopping(entry.recipeId, entry.servings); count++; });
    if(count===0) toast('Aucun menu planifié pour le moment');
    else go('shopping');
  };
}

/* ---------------- PROFILE bindings ---------------- */
function bindProfileEvents(app){
  const exp = document.getElementById('exportBackup');
  if(exp) exp.onclick = ()=>{
    const data = {recipes:RECIPES, shopping:SHOPPING, menu:MENU, exportedAt:nowISO()};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'carnet-de-cuisine-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    toast('Sauvegarde exportée');
  };
  const imp = document.getElementById('importBackup');
  const impLabel = document.getElementById('importBackupLabel');
  if(impLabel && imp) impLabel.onclick = (e)=>{ if(!e.isTrusted) return; e.preventDefault(); imp.click(); };
  if(imp) imp.onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(data.recipes){ RECIPES = data.recipes; persistRecipes(); }
        if(data.shopping){ SHOPPING = data.shopping; persistShopping(); }
        if(data.menu){ MENU = data.menu; persistMenu(); }
        toast('Sauvegarde importée avec succès');
        render();
      }catch(err){ toast('Fichier de sauvegarde invalide'); }
    };
    reader.readAsText(f);
  };
  const guestEmailInput = document.getElementById('guestEmailInput');
  if(guestEmailInput){
    guestEmailInput.onchange = ()=>{
      const meta = load(META_KEY, {});
      meta.guestEmail = guestEmailInput.value.trim();
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      toast('E-mail enregistré');
    };
  }
  const guestPhoneInput = document.getElementById('guestPhoneInput');
  if(guestPhoneInput){
    guestPhoneInput.onchange = ()=>{
      const meta = load(META_KEY, {});
      meta.guestPhone = guestPhoneInput.value.trim().replace(/[^\d+]/g,'');
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      toast('Numéro enregistré');
    };
  }
}

/* ---------------- INIT ---------------- */
const logoHomeLink = document.getElementById('logoHomeLink');
if(logoHomeLink) logoHomeLink.addEventListener('click', (e)=>{ e.preventDefault(); go('home'); });

(function init(){
  try{
    if(location.hash.startsWith('#guest=')){
      const payload = b64decode(location.hash.slice(7));
      if(payload && payload.id){ renderGuestPage(payload); return; }
    }
  }catch(guestErr){
    console.error('Erreur page invité, retour à l\'accueil', guestErr);
  }
  try{ restoreTimers(); }catch(timerErr){ console.error('Restauration minuteurs', timerErr); }
  try{
    const raw = sessionStorage.getItem(VIEW_STATE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && saved.view){ state.view = saved.view; state.params = saved.params || {}; }
    }
  }catch(viewErr){ console.error('Restauration de la page', viewErr); }
  try{
    render();
  }catch(renderErr){
    console.error('Erreur au chargement', renderErr);
    document.getElementById('app').innerHTML =
      '<div style="padding:40px 20px;text-align:center;color:#6B5747">'
      + '<p style="font-weight:800;margin-bottom:8px">Un problème est survenu au chargement.</p>'
      + '<p style="font-size:0.85rem">Essaie de recharger la page. Si ça persiste, exporte ta sauvegarde depuis un appareil où l\'app fonctionne, puis réimporte-la ici.</p>'
      + '</div>';
  }
  try{
    const rawCook = sessionStorage.getItem(COOKING_STATE_KEY);
    if(rawCook){
      const savedCook = JSON.parse(rawCook);
      if(savedCook && savedCook.recipeId && getRecipe(savedCook.recipeId)){
        state.cooking = savedCook;
        requestWakeLock();
        renderCookOverlay();
      } else {
        sessionStorage.removeItem(COOKING_STATE_KEY);
      }
    }
  }catch(cookErr){ console.error('Restauration mode cuisine', cookErr); }
})();
</script>
